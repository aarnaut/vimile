name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-progress build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for a Java 25 daemon; installing it here
      # saves Gradle from downloading one on every run.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's downloads and build outputs between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK with licenses accepted, so the Android
      # Gradle Plugin installs any missing platform (e.g. android-37) by itself.
      - name: Build and lint
        run: ./gradlew assembleDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vimile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
